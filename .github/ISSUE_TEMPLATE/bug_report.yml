name: Bug report
description: A defect in released GameTools behaviour
labels: ["type: bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The `io.github.spartanlaboratories:GameTools` version in use.
      placeholder: "1.9.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Minimal steps or a code snippet that reproduces it.
      render: kotlin
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed fix
      description: Optional — where the defect lives and how you'd address it.
  - type: textarea
    id: downstream
    attributes:
      label: Downstream follow-up
      description: Optional — changes this implies in MyGameServer, GameGraphics, etc.
