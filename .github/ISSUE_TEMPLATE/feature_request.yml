name: Feature request
description: A new capability or an API change
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today, and the concrete situation where it bites.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed API
      description: The shape of the change — signatures, behaviour, hooks.
      render: kotlin
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives & open questions
      description: Optional — other designs considered, decisions still open.
  - type: textarea
    id: downstream
    attributes:
      label: Downstream follow-up
      description: Optional — what this unblocks or requires in MyGameServer, GameGraphics, etc.
